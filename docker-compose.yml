# Dosya Yolu: REPO_ROOT/docker-compose.yml
# Amac: SQL Server 2022 test ortamini Docker Compose ile baslatir
# Modul - YAML
# Version: 2.0.1
# Aciklama: Named volume, backup mount ve yalnizca localhost TCP portu
# Bagimli Oldugu Katman: Config

services:
  mssql-test:
    image: ${MSSQL_IMAGE}
    container_name: ${MSSQL_CONTAINER_NAME}
    hostname: ${MSSQL_HOSTNAME}
    restart: unless-stopped
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: ${MSSQL_SA_PASSWORD}
      MSSQL_PID: ${MSSQL_PID}
    ports:
      - "127.0.0.1:${MSSQL_PORT}:1433"
    volumes:
      - mssql-data:/var/opt/mssql
      - ./backup:/backup
    healthcheck:
      test:
        - CMD-SHELL
        - SQLCMDPASSWORD="$$MSSQL_SA_PASSWORD" /opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -C -Q "SELECT 1" || exit 1
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s

volumes:
  mssql-data:
    name: ${MSSQL_VOLUME_NAME}
